<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>StudyHub</h2>
            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">Subjects</a>
                <a href="#">Notes</a>
                <a href="#">Tasks</a>
                <a href="#">Calendar</a>
                <a href="#">Profile</a>
            </nav>
            <a href="#" class="logout">Log Out</a>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <input type="text" placeholder="Search anything...">
                <div class="profile">
                    <span class="notification">●</span>
                    <span>Ojas</span>
                    <small>Student</small>
                </div>
            </header>

            <section class="welcome">
                <h1>Dashboard</h1>
                <p>Organize. Study. Achieve.</p>
            </section>

            <section class="stats">
                <div class="card">
                    <span class="icon">📚</span>
                    <strong>5</strong>
                    <p>Subjects</p>
                </div>
                <div class="card">
                    <span class="icon">📝</span>
                    <strong>8</strong>
                    <p>Notes</p>
                </div>
                <div class="card">
                    <span class="icon">✓</span>
                    <strong>6</strong>
                    <p>Tasks</p>
                </div>
                <div class="card">
                    <span class="icon">📅</span>
                    <strong>2</strong>
                    <p>Events</p>
                </div>
            </section>

            <section class="content-grid">
                <div class="panel">
                    <h2>Upcoming Tasks</h2>
                    <p>Complete CN notes</p>
                    <p>Read ML chapter 3</p>
                    <p>Prepare for test</p>
                </div>

                <div class="panel quote">
                    <h2>Small steps</h2>
                    <p>lead to big results.</p>
                    <span>🌱</span>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
